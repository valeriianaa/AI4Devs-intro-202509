<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reverse String</title>

  <!-- ✅ Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 text-center">
        <h1 class="mb-4">Reverse String</h1>

        <input type="text" id="inputText" class="form-control mb-3" placeholder="Enter a string">

        <button id="reverseBtn" class="btn btn-primary mb-3">Reverse</button>

        <div id="result" class="fs-4 fw-bold text-primary"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS (for optional components like buttons) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- External JavaScript -->
  <script src="script.js"></script>
</body>
</html>
